[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
  ".venv",
  "__pycache__",
]

[tool.ruff.lint]
select = [
  "I",     # isort
  "F",     # pyflakes
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "B",     # flake8-bugbear
  "UP",    # pyupgrade
  "SIM",   # flake8-simplify
  "C4",    # flake8-comprehensions
  "TID",   # flake8-tidy-imports
  "PERF",  # perflint
  "RUF",   # ruff-specific
  "PTH",   # use pathlib over os.path
  "ERA",   # detect comented code
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/__init__.py" = ["F401"] # Ignore unused import warning for `__init__` file
